<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#10b981" stroke="#059669" stroke-width="4"/>
  
  <!-- Animal paw print design -->
  <g fill="white" opacity="0.95">
    <!-- Main pad -->
    <ellipse cx="100" cy="120" rx="35" ry="30"/>
    <!-- Top pads -->
    <ellipse cx="75" cy="80" rx="18" ry="20"/>
    <ellipse cx="100" cy="70" rx="18" ry="20"/>
    <ellipse cx="125" cy="80" rx="18" ry="20"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">CAPWA</text>
</svg>

