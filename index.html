<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CAPWA - Community Animals Partners & Welfare Advocates. Report and manage animal welfare incidents across the Philippines." />
    <title>CAPWA - Animal Welfare Philippines</title>
    <script>
      // Prevent flash of wrong theme by setting theme before page render
      (function() {
        const theme = localStorage.getItem('capwa-theme') || 
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
